# Template repo only — deleted by `just init`.
name: Template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  init:
    name: Init (${{ matrix.os }}, ${{ matrix.args }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        args: ["demo-app", "demo-app --lib --license agpl"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny,cargo-shear
      - name: xtask unit tests
        run: cargo test -p xtask
      - name: Run init
        shell: bash
        run: cargo xtask init $INIT_ARGS # unquoted on purpose: split into arguments
        env:
          INIT_ARGS: ${{ matrix.args }}
      - name: No template leftovers
        shell: bash
        run: |
          if grep -rnI --exclude-dir=target --exclude-dir=.git -e 'rust-template' -e 'rust_template' -e 'init:[a-z]*:' .; then
            echo "template leftovers found"; exit 1
          fi
          test ! -e xtask && test ! -e .cargo && test ! -e .github/workflows/template.yml
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo shear
      - run: cargo deny check licenses
