name: Release-plz

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    name: Release-plz release
    # Never release from the template repository itself.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write # crates.io trusted publishing
    steps:
      # App token so the tags it pushes trigger the dist release workflow.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Tags, GitHub Releases; reads the merged release PR.
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: release-plz/action@51e32d708d306b2c2e98540245b276439f3137c3 # v0.5.139
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-pr:
    name: Release-plz PR
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # writes go through the App token
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # App token so CI runs on the release PR.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Release branch commits and the release PR.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: release-plz/action@51e32d708d306b2c2e98540245b276439f3137c3 # v0.5.139
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
